<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NullClipper</title>
    <link rel="stylesheet" href="overlay.css" />
    <script>
      if (new URLSearchParams(location.search).get('copy') === '1') {
        document.documentElement.classList.add('copy-only');
      }
    </script>
  </head>
  <body>
    <textarea id="nc-clip-text" class="nc-clip-fallback" aria-hidden="true" readonly></textarea>
    <div id="nc-clip-html" class="nc-clip-fallback" contenteditable="true" aria-hidden="true"></div>
    <div class="nc-root">
      <img class="nc-freeze" alt="" />
      <div class="nc-dim"></div>
      <div class="nc-selection"></div>
      <div class="nc-badge"></div>
      <div class="nc-toolbar">
        <div class="nc-kinds">
          <button type="button" class="nc-kind on" data-kind="snip">Snip</button>
          <button type="button" class="nc-kind" data-kind="gif">GIF</button>
        </div>
        <div class="nc-split"></div>
        <button type="button" class="nc-tool region on" title="Rectangular snip">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="2.5" y="2.5" width="11" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4" />
            <path d="M2.5 6.5h11M6.5 2.5v11" stroke="currentColor" stroke-width="1.2" />
          </svg>
        </button>
        <button type="button" class="nc-tool full" title="Visible tab">
          <svg viewBox="0 0 16 16" fill="none">
            <path
              d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div class="nc-split"></div>
        <button type="button" class="nc-tool close" title="Close">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
