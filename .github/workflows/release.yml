name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.0.1). Ignored when this run is already a tag push."
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v1.0.0" }
          $version = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $tag ($version)"

      - name: Publish win-x64 (framework-dependent)
        run: >
          dotnet publish Clipper.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist/win-x64

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/NullClipper-win-x64.zip -Force

      - name: Package extension zip
        shell: pwsh
        run: powershell -File extension/pack.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: powershell -File installer/build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NullClipper ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/NullClipper-Setup.exe
            dist/NullClipper-win-x64.zip
            dist/NullClipper-extension.zip
          body: |
            ## NullClipper ${{ steps.version.outputs.tag }}

            ### Windows
            - **One click:** download **NullClipper-Setup.exe**, double-click, Next, Finish.
            - **Portable:** **NullClipper-win-x64.zip** — extract and run `NullClipper.exe`.

            Requires the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) for Windows x64.

            ### Browser extension (Chrome / Edge / Opera)
            Download **NullClipper-extension.zip**, unzip, then Load unpacked in Developer mode.
            Store listings (true 1-click) are not live yet.

            Opera: sideload still needs Developer mode; the extension does not inject into pages, so google.com captures work.

            ### What's inside
            - Tray snipping tool for Windows
            - Snip or GIF from the overlay toolbar
            - Region, freeform, window, and fullscreen capture
            - Premium toast with a thumbnail after each capture
            - Settings minimizes to the tray (no title-bar close)
            - Optional NullImage encrypted share links (1 hour to 7 days)
            - Tab snip / GIF extension (no content-script injection)
