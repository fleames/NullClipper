<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NullClipper Opera promo</title>
    <style>
      html,
      body {
        margin: 0;
        width: 300px;
        height: 188px;
        overflow: hidden;
        background: #0b0f14;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        color: #f3f4f6;
      }
      .tile {
        width: 300px;
        height: 188px;
        box-sizing: border-box;
        background:
          radial-gradient(ellipse at 8% 0%, #3b82f6 0%, transparent 42%),
          linear-gradient(160deg, #12181f 0%, #0b0f14 55%, #0a1220 100%);
        display: flex;
        align-items: center;
        padding: 0 16px 0 20px;
        gap: 12px;
        border-left: 3px solid #3b82f6;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      p {
        margin: 6px 0 0;
        font-size: 13px;
        color: #9ca3af;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <img src="../../../Assets/clipper-icon.png" alt="" />
      <div>
        <h1>NullClipper</h1>
        <p>Snip or GIF this tab</p>
      </div>
    </div>
  </body>
</html>
