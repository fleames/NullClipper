<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../../extension/popup.css" />
    <style>
      html,
      body {
        background: #0b0f14;
      }
      body {
        width: 400px;
      }
      .stack {
        padding: 12px 16px 14px;
        gap: 10px;
      }
      .card-inner {
        padding: 12px 14px;
      }
      .rule {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="titlebar">
        <div class="brand-icon">
          <img src="../../../extension/icons/clipper-icon.png" alt="" />
        </div>
        <div class="brand">NullClipper</div>
      </header>
      <div class="stack">
        <button class="cta" type="button">
          <span class="cta-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none">
              <rect x="1.5" y="3.5" width="13" height="9" rx="1.5" stroke="white" stroke-width="1.4" />
              <circle cx="8" cy="8" r="2.4" stroke="white" stroke-width="1.4" />
            </svg>
          </span>
          <span>
            <div class="cta-title">Capture</div>
            <div class="cta-sub">Current tab — region or full view</div>
          </span>
          <span class="cta-chevron" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M4.5 2.5L8 6l-3.5 3.5" stroke="white" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </span>
        </button>
        <section class="card">
          <div class="card-inner">
            <div class="label">MODE</div>
            <div class="segments">
              <button type="button" class="on">Snip</button>
              <button type="button">GIF</button>
            </div>
            <p class="hint">Snip copies a still image. GIF records the same region.</p>
          </div>
        </section>
        <section class="card">
          <div class="card-inner">
            <div class="ni-head">
              <div class="ni-icon" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                  <rect x="2" y="2" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3" />
                  <rect x="8" y="8" width="6" height="6" rx="1.2" stroke="currentColor" stroke-width="1.3" />
                </svg>
              </div>
              <div>
                <div class="ni-title">NullImage</div>
                <div class="ni-sub">Encrypted snips with a shareable link.</div>
              </div>
            </div>
            <button class="switch-row" type="button" style="padding: 0">
              <span>Enable NullImage uploads</span>
              <span class="switch on"></span>
            </button>
            <div>
              <div class="rule"></div>
              <div class="label">SERVER</div>
              <input class="field" type="url" value="https://nullimage.org" readonly />
              <div class="rule"></div>
              <div class="label">EXPIRES</div>
              <select class="select" disabled>
                <option selected>1 day</option>
              </select>
              <div class="rule"></div>
              <button class="switch-row" type="button" style="padding: 0">
                <span>Burn after first view</span>
                <span class="switch"></span>
              </button>
              <div class="rule"></div>
              <div class="label">PASSWORD</div>
              <input class="field" type="text" placeholder="Optional — protects each upload" readonly />
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
