<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NullClipper promo</title>
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: #0b0f14;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        color: #f3f4f6;
      }
      .tile {
        width: 440px;
        height: 280px;
        background:
          radial-gradient(ellipse at 18% 0%, #1e3a5f 0%, transparent 55%),
          linear-gradient(160deg, #12181f 0%, #0b0f14 55%, #0a1220 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 36px;
        gap: 14px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        font-size: 15px;
        color: #9ca3af;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <img src="../../../extension/icons/icon128.png" alt="" />
      <h1>NullClipper</h1>
      <p>Snip or GIF the current tab.</p>
    </div>
  </body>
</html>
