<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NullClipper crop overlay</title>
    <link rel="stylesheet" href="shot.css" />
    <link rel="stylesheet" href="../../../extension/overlay.css" />
    <style>
      html,
      body {
        width: 1280px;
        height: 800px;
        background: #000;
      }
      .page {
        position: absolute;
        inset: 0;
        background: #f4f1ea;
        padding: 88px 96px;
        color: #1f2933;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      }
      .page .kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #3b82f6;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .page h1 {
        margin: 0 0 14px;
        font-size: 36px;
        letter-spacing: -0.03em;
      }
      .page p {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 1.55;
        color: #5b6570;
        max-width: 62ch;
      }
      .hero {
        margin-top: 28px;
        width: 720px;
        background: #fff;
        border: 1px solid #e5e1d8;
        border-radius: 16px;
        padding: 22px 24px 20px;
        box-shadow: 0 12px 32px rgba(31, 41, 51, 0.08);
      }
      .hero h2 {
        margin: 0 0 14px;
        font-size: 15px;
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        height: 140px;
      }
      .bars span {
        flex: 1;
        border-radius: 7px 7px 2px 2px;
        background: linear-gradient(180deg, #60a5fa, #2563eb);
      }
      .nc-dim {
        display: none;
      }
      .nc-selection {
        display: block;
        left: 96px;
        top: 268px;
        width: 768px;
        height: 236px;
      }
      .nc-badge {
        display: block;
        left: 96px;
        top: 512px;
      }
    </style>
  </head>
  <body>
    <div class="nc-root">
      <div class="page">
        <div class="kicker">Example notes</div>
        <h1>Release checklist</h1>
        <p>
          Draw a region on the freeze-frame of the current tab. The rest of the page is dimmed. Esc
          cancels. This is a sample article, not anyone’s desktop.
        </p>
        <p>Snip copies a PNG. GIF records this same rectangle for up to eight seconds.</p>
        <div class="hero">
          <h2>This week</h2>
          <div class="bars">
            <span style="height: 40%"></span>
            <span style="height: 68%"></span>
            <span style="height: 52%"></span>
            <span style="height: 90%"></span>
            <span style="height: 61%"></span>
            <span style="height: 34%"></span>
            <span style="height: 74%"></span>
          </div>
        </div>
      </div>
      <div class="nc-dim"></div>
      <div class="nc-selection"></div>
      <div class="nc-badge">768 × 236</div>
      <div class="nc-toolbar">
        <div class="nc-kinds">
          <button type="button" class="nc-kind on">Snip</button>
          <button type="button" class="nc-kind">GIF</button>
        </div>
        <div class="nc-split"></div>
        <button type="button" class="nc-tool region on" title="Rectangular snip">
          <svg viewBox="0 0 16 16" fill="none">
            <rect x="2.5" y="2.5" width="11" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4" />
            <path d="M2.5 6.5h11M6.5 2.5v11" stroke="currentColor" stroke-width="1.2" />
          </svg>
        </button>
        <button type="button" class="nc-tool full" title="Visible tab">
          <svg viewBox="0 0 16 16" fill="none">
            <path
              d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <div class="nc-split"></div>
        <button type="button" class="nc-tool close" title="Close">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
